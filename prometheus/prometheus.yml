global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # App running inside docker-compose
  - job_name: calorie-api
    metrics_path: /metrics
    static_configs:
      - targets: ["app:5000"]

  # App running on the host
  - job_name: calorie-api-local
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:5000"]
